name: Egress reconnect stress

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Legacy egress smoke scenario
        required: true
        default: reconnect
        type: choice
        options:
          - reconnect
          - stop-terminal
          - both
      runs:
        description: Iterations per selected scenario
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: egress-reconnect-stress
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IRLIGHT_EGRESS_RECONNECT_STRESS_RUNS: ${{ inputs.runs }}
      IRLIGHT_EGRESS_RECONNECT_STRESS_SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate stress harness shell syntax
        run: bash -n ./scripts/stress-egress-reconnect.sh
      - name: Exercise legacy egress reconnect stress harness
        id: egress_stress
        shell: bash
        run: |
          stress_status=0
          bash ./scripts/stress-egress-reconnect.sh || stress_status=$?

          if (( stress_status != 0 )); then
            evidence_dir="$RUNNER_TEMP/irlight-egress-reconnect-stress-diagnostics"
            mkdir -p "$evidence_dir"
            if [[ -s "$GITHUB_STEP_SUMMARY" ]]; then
              cp -- "$GITHUB_STEP_SUMMARY" "$evidence_dir/summary.md"
            else
              printf '%s\n' 'Egress reconnect stress fingerprint unavailable.' >"$evidence_dir/summary-unavailable.txt"
            fi
          fi

          exit "$stress_status"
      - name: Retain reconnect stress failure evidence
        if: ${{ failure() && steps.egress_stress.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: egress-reconnect-stress-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/irlight-egress-reconnect-stress-diagnostics
          if-no-files-found: warn
          retention-days: 3
