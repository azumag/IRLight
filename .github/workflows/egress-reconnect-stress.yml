name: Egress reconnect stress

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Legacy egress smoke scenario
        required: true
        default: reconnect
        type: choice
        options:
          - reconnect
          - stop-terminal
          - both
      runs:
        description: Iterations per selected scenario
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: egress-reconnect-stress
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IRLIGHT_EGRESS_RECONNECT_STRESS_RUNS: ${{ inputs.runs }}
      IRLIGHT_EGRESS_RECONNECT_STRESS_SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate stress harness shell syntax
        run: bash -n ./scripts/stress-egress-reconnect.sh
      - name: Exercise legacy egress reconnect stress harness
        shell: bash
        run: bash ./scripts/stress-egress-reconnect.sh
