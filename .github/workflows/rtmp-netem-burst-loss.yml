name: RTMP netem burst loss E2E

on:
  pull_request:
    paths:
      - "apps/continuity/**"
      - "apps/node-agent/**"
      - "apps/control-api/ingest_store.py"
      - "apps/control-api/node_internal.py"
      - "apps/control-api/session_store.py"
      - "config/mediamtx.yml"
      - "docker-compose.poc.yml"
      - "scripts/netem-container.sh"
      - "scripts/smoke-rtmp-netem-degradation-matrix.sh"
      - ".github/workflows/rtmp-netem-burst-loss.yml"
  workflow_dispatch:
    inputs:
      loss_correlation:
        description: "Correlation percentage for 10% packet loss"
        required: true
        default: "75"
        type: choice
        options:
          - "50"
          - "75"
          - "90"
      profile_seconds:
        description: "Seconds to keep the burst-loss profile active"
        required: true
        default: "12"
        type: choice
        options:
          - "8"
          - "12"
          - "20"

permissions:
  contents: read

jobs:
  rtmp-netem-burst-loss:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LOSS_CORRELATION: ${{ github.event_name == 'workflow_dispatch' && inputs.loss_correlation || '75' }}
      NETEM_PROFILE_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_seconds || '12' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify host network fault tools
        run: |
          command -v tc
          command -v nsenter
      - name: Validate netem helper syntax
        run: bash -n ./scripts/netem-container.sh
      - name: Run correlated burst-loss RTMP profile
        shell: bash
        run: |
          set -euo pipefail
          NETEM_MATRIX_PROFILES=loss-10 \
          NETEM_LOSS_CORRELATION="$LOSS_CORRELATION" \
            bash ./scripts/smoke-rtmp-netem-degradation-matrix.sh | tee /tmp/irlight-burst-loss.log

          grep -Eq "loss 10(\\.0+)?%[[:space:]]+${LOSS_CORRELATION}(\\.0+)?%" \
            /tmp/irlight-burst-loss.log
