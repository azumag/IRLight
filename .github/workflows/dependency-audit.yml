name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-consistency:
    name: dependency-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/control-api/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r apps/control-api/requirements.txt
      - name: Check resolved dependency compatibility
        run: python -m pip check

  dependency-vulnerability-audit:
    name: dependency-vulnerability-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/control-api/requirements.txt
      - name: Install audit tooling
        run: python -m pip install pip-audit==2.10.1
      - name: Verify the audit detects a known advisory
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pip_audit \
            --strict \
            --progress-spinner off \
            --format json \
            --output /tmp/known-vulnerable.json \
            --requirement tests/fixtures/dependency-audit/known-vulnerable.txt
          audit_status=$?
          set -e

          if [[ "$audit_status" -ne 1 ]]; then
            echo "Expected the known-vulnerable fixture to produce pip-audit exit code 1; got ${audit_status}." >&2
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("/tmp/known-vulnerable.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if isinstance(report, list):
              dependencies = report
          elif isinstance(report, dict):
              dependencies = report.get("dependencies", [])
          else:
              raise SystemExit("Unexpected pip-audit JSON report shape")

          matches = [
              dependency
              for dependency in dependencies
              if dependency.get("name", "").lower() == "starlette"
              and dependency.get("version") == "0.47.3"
              and dependency.get("vulns")
          ]
          if not matches:
              raise SystemExit("Known-vulnerable Starlette fixture did not produce an advisory result")
          PY
      - name: Verify the patched fixture is clean
        run: |
          python -m pip_audit \
            --strict \
            --progress-spinner off \
            --requirement tests/fixtures/dependency-audit/patched.txt
      - name: Audit runtime requirements
        run: |
          # Keep dependency resolution enabled so transitive packages are audited too.
          # Do not add --ignore-vuln without a documented, time-bounded exception.
          python -m pip_audit \
            --strict \
            --progress-spinner off \
            --format json \
            --output /tmp/runtime-dependency-audit.json \
            --requirement apps/control-api/requirements.txt
      - name: Generate runtime dependency SBOM
        run: |
          python -m pip_audit \
            --strict \
            --progress-spinner off \
            --format cyclonedx-json \
            --output /tmp/runtime-dependency-sbom.cdx.json \
            --requirement apps/control-api/requirements.txt
      - name: Validate runtime dependency SBOM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sbom_path = Path("/tmp/runtime-dependency-sbom.cdx.json")
          sbom = json.loads(sbom_path.read_text(encoding="utf-8"))

          if sbom.get("bomFormat") != "CycloneDX":
              raise SystemExit("Runtime dependency SBOM is not CycloneDX JSON")

          components = sbom.get("components")
          if not isinstance(components, list) or not components:
              raise SystemExit("Runtime dependency SBOM contains no components")

          component_names = {
              str(component.get("name", "")).lower()
              for component in components
              if isinstance(component, dict)
          }
          required_components = {"fastapi", "starlette", "uvicorn", "cryptography"}
          missing = sorted(required_components - component_names)
          if missing:
              raise SystemExit(f"Runtime dependency SBOM is missing direct requirements: {missing}")
          PY
      - name: Retain runtime audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-dependency-audit
          path: /tmp/runtime-dependency-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain runtime dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-dependency-sbom
          path: /tmp/runtime-dependency-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
