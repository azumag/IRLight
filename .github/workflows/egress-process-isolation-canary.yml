name: Egress process-isolation canary

on:
  pull_request:
    paths:
      - "apps/egress-gateway/**"
      - "docker-compose.poc.yml"
      - "scripts/smoke-egress-isolated-reconnect.sh"
      - "scripts/smoke-egress-isolated-stop-terminal.sh"
      - "scripts/smoke-egress-isolated-auth-terminal.sh"
      - ".github/workflows/egress-process-isolation-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egress-process-isolation-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-legacy-reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify legacy attempt fencing and recovery
        run: |
          timeout --signal=TERM --kill-after=10s 600s \
            bash scripts/smoke-egress-isolated-reconnect.sh

  isolated-legacy-user-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify bounded isolated child stop and terminal state
        run: |
          timeout --signal=TERM --kill-after=10s 600s \
            bash scripts/smoke-egress-isolated-stop-terminal.sh

  isolated-legacy-auth-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify auth rejection remains terminal without retry
        run: |
          timeout --signal=TERM --kill-after=10s 600s \
            bash scripts/smoke-egress-isolated-auth-terminal.sh
