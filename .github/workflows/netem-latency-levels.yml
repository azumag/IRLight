name: RTMP/SRT netem latency levels

on:
  pull_request:
    paths:
      - "apps/continuity/**"
      - "apps/node-agent/**"
      - "apps/control-api/ingest_store.py"
      - "apps/control-api/node_internal.py"
      - "apps/control-api/session_store.py"
      - "config/mediamtx.yml"
      - "docker-compose.poc.yml"
      - "scripts/netem-container.sh"
      - "scripts/smoke-rtmp-netem-degradation-matrix.sh"
      - "scripts/smoke-srt-netem-degradation-matrix.sh"
      - "scripts/smoke-netem-latency-levels.sh"
      - ".github/workflows/netem-latency-levels.yml"
  workflow_dispatch:
    inputs:
      profile_seconds:
        description: "Seconds per latency profile"
        required: true
        default: "12"
        type: choice
        options:
          - "8"
          - "12"
          - "20"

permissions:
  contents: read

jobs:
  latency-levels:
    name: ${{ matrix.protocol }} latency 50/100/300/1000ms
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        protocol:
          - rtmp
          - srt
    env:
      NETEM_PROFILE_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_seconds || '12' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify host network fault tools
        run: |
          command -v tc
          command -v nsenter
      - name: Validate latency harness syntax
        run: bash -n ./scripts/smoke-netem-latency-levels.sh
      - name: Run real ${{ matrix.protocol }} latency levels
        run: bash ./scripts/smoke-netem-latency-levels.sh "${{ matrix.protocol }}"
