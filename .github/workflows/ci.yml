name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/control-api/requirements.txt
      - name: Install Python dependencies
        run: pip install -r apps/control-api/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q apps provider
      - name: Validate shell scripts
        run: find scripts -type f -name '*.sh' -exec bash -n {} +
      - name: Validate production RTMPS compose overlays
        run: |
          mkdir -p secrets
          : > secrets/bootstrap_token
          : > /tmp/irlight-rtmps.key
          : > /tmp/irlight-rtmps.crt
          NODE_RTMPS_KEY_FILE=/tmp/irlight-rtmps.key \
          NODE_RTMPS_CERT_FILE=/tmp/irlight-rtmps.crt \
            docker compose \
              -f docker-compose.node.yml \
              -f docker-compose.node.public.yml \
              -f docker-compose.node.rtmps.yml config >/dev/null

  node-agent-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the Node Agent can control Docker Compose
        run: |
          docker build \
            -t irlight-node-agent-ci \
            -f apps/node-agent/Dockerfile \
            apps/node-agent
          docker run --rm --entrypoint docker irlight-node-agent-ci compose version
          docker run --rm --entrypoint test irlight-node-agent-ci \
            -r /opt/irlight/docker-compose.control.yml
          docker compose -f apps/node-agent/docker-compose.control.yml config >/dev/null

  docker-smoke:
    runs-on: ubuntu-latest
    # Cold continuity builds install ~200 MB of Ubuntu/GStreamer packages.
    # Keep the workflow budget above transient mirror slowness; the smoke
    # scripts retain their own bounded readiness/process timeouts.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and exercise the vertical slice
        run: ./scripts/smoke-compose.sh

  continuity-restart-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise Continuity process restart and desired/actual reconcile
        run: bash ./scripts/smoke-continuity-restart.sh

  rtmps-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise certificate-validated RTMPS handshake
        run: bash ./scripts/smoke-rtmps.sh

  ingest-quality-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise FPS degradation without kicking publisher
        run: bash ./scripts/smoke-ingest-quality.sh

  unusable-media-holding-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise one-sided media loss and format-change HOLDING
        run: bash ./scripts/smoke-unusable-media-holding.sh

  ingest-auth-abuse-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise ingest auth failure lockout
        run: bash ./scripts/smoke-ingest-auth-abuse.sh

  ingest-auth-cache-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise node-local auth fallback and revoke eviction
        run: bash ./scripts/smoke-ingest-auth-cache.sh

  session-ingest-events-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise user Session assignment and ingest events
        run: bash ./scripts/smoke-session-ingest-events.sh

  egress-secret-delivery-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise encrypted Destination secret delivery
        run: bash ./scripts/smoke-egress-secret-delivery.sh

  egress-reconnect-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise isolated egress outage and recovery
        run: bash ./scripts/smoke-egress-reconnect.sh

  egress-stop-terminal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise egress stop/reconnect race and terminal guard failure
        run: bash ./scripts/smoke-egress-stop-terminal.sh

  egress-dns-tls-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise egress DNS and RTMPS certificate failures
        run: bash ./scripts/smoke-egress-dns-tls.sh

  egress-publish-conflict-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise terminal egress publish conflict
        run: bash ./scripts/smoke-egress-publish-conflict.sh
