name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/control-api/requirements.txt
      - name: Install Python dependencies
        run: pip install -r apps/control-api/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q apps provider
      - name: Validate shell scripts
        run: find scripts -type f -name '*.sh' -exec bash -n {} +
      - name: Validate production RTMPS compose overlays
        run: |
          mkdir -p secrets
          : > secrets/bootstrap_token
          : > /tmp/irlight-rtmps.key
          : > /tmp/irlight-rtmps.crt
          NODE_RTMPS_KEY_FILE=/tmp/irlight-rtmps.key \
          NODE_RTMPS_CERT_FILE=/tmp/irlight-rtmps.crt \
            docker compose \
              -f docker-compose.node.yml \
              -f docker-compose.node.public.yml \
              -f docker-compose.node.rtmps.yml config >/dev/null

  node-agent-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify the Node Agent can control Docker Compose
        run: |
          docker build \
            -t irlight-node-agent-ci \
            -f apps/node-agent/Dockerfile \
            apps/node-agent
          docker run --rm --entrypoint docker irlight-node-agent-ci compose version
          docker run --rm --entrypoint test irlight-node-agent-ci \
            -r /opt/irlight/docker-compose.control.yml
          docker compose -f apps/node-agent/docker-compose.control.yml config >/dev/null

  docker-smoke-suite:
    runs-on: ubuntu-latest
    # Keep the Docker-heavy scenarios on one runner so Compose/BuildKit layers
    # are reused instead of downloading the same Ubuntu/GStreamer dependency
    # set independently on more than a dozen runners.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Warm shared local images
        run: docker compose -f docker-compose.poc.yml build continuity control-ui node-agent
      - name: Bound Docker build cache before smoke suite
        run: |
          set -euo pipefail
          echo "::group::Docker storage before cache prune"
          df -h /
          docker system df
          echo "::endgroup::"

          # Keep the newest warm-build cache so the run-scoped Compose projects
          # can reuse expensive Ubuntu/GStreamer layers, but cap it so the
          # overlapping isolation smoke still has filesystem headroom. A full
          # `builder prune --all` here defeats the shared-cache design and turns
          # the isolation probe back into a cold rebuild.
          docker builder prune --all --force --keep-storage 6GB
          docker image prune --force

          echo "::group::Docker storage after cache prune"
          df -h /
          docker system df
          echo "::endgroup::"
      - name: Exercise Docker integration smoke suite
        run: bash ./scripts/ci-docker-smoke-suite.sh

  # Compatibility gates retain the previous check names for repositories that
  # may require them in branch protection. The actual scenarios run once in the
  # shared suite above; each gate mirrors that suite result without rebuilding.
  docker-smoke:
    needs: docker-smoke-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.docker-smoke-suite.result }}" = success

  continuity-restart-smoke:
    needs: docker-smoke-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.docker-smoke-suite.result }}" = success

  rtmps-smoke:
    needs: docker-smoke-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.docker-smoke-suite.result }}" = success

  ingest-quality-smoke:
