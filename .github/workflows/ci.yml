name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Expand the reviewed source bundle when present
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! compgen -G "bootstrap/phase0.tar.gz.b64.part-*" >/dev/null; then
            echo "No bootstrap bundle to expand."
            exit 0
          fi
          cat bootstrap/phase0.tar.gz.b64.part-* | base64 --decode | tar -xzf -
          rm -f bootstrap/phase0.tar.gz.b64.part-*
          rmdir bootstrap 2>/dev/null || true
      - name: Commit materialized Phase 0 files
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No materialization changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Phase 0 vertical slice"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  unit:
    needs: materialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: pip install -r apps/control-api/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile apps/continuity/state.py apps/continuity/continuity.py apps/continuity/secret_files.py apps/control-api/app.py apps/control-api/node_internal.py apps/control-api/auth_store.py apps/control-api/auth_api.py apps/control-api/catalog_api.py apps/control-api/catalog_store.py apps/control-api/destination_probe.py apps/control-api/entitlement_store.py apps/control-api/ingest_api.py apps/control-api/ingest_auth_guard.py apps/control-api/ingest_store.py apps/control-api/session_api.py apps/control-api/session_store.py apps/control-api/session_workflow.py apps/control-api/reaper.py apps/control-api/reaper_cli.py apps/control-api/fake_provider_for_api.py apps/node-agent/agent.py apps/node-agent/node_entrypoint.py apps/node-agent/ingest_auth_proxy.py apps/node-agent/ingest_policy.py apps/node-agent/ingest_quality.py apps/node-agent/supervisor.py provider/admin_cli.py provider/conoha.py provider/fake_provider.py provider/provider_client.py
      - name: Validate shell scripts
        run: bash -n scripts/publish-test.sh scripts/preview-output.sh scripts/smoke-control.sh scripts/smoke-compose.sh scripts/smoke-rtmps.sh scripts/smoke-ingest-quality.sh scripts/smoke-ingest-auth-abuse.sh scripts/smoke-ingest-auth-cache.sh scripts/smoke-session-ingest-events.sh
      - name: Validate production RTMPS compose overlays
        run: |
          mkdir -p secrets
          : > secrets/bootstrap_token
          : > /tmp/irlight-rtmps.key
          : > /tmp/irlight-rtmps.crt
          NODE_RTMPS_KEY_FILE=/tmp/irlight-rtmps.key \
          NODE_RTMPS_CERT_FILE=/tmp/irlight-rtmps.crt \
            docker compose \
              -f docker-compose.node.yml \
              -f docker-compose.node.public.yml \
              -f docker-compose.node.rtmps.yml config >/dev/null

  docker-smoke:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Build and exercise the vertical slice
        run: ./scripts/smoke-compose.sh

  rtmps-smoke:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Exercise certificate-validated RTMPS handshake
        run: bash ./scripts/smoke-rtmps.sh

  ingest-quality-smoke:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Exercise FPS degradation without kicking publisher
        run: bash ./scripts/smoke-ingest-quality.sh

  ingest-auth-abuse-smoke:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Exercise ingest auth failure lockout
        run: bash ./scripts/smoke-ingest-auth-abuse.sh

  ingest-auth-cache-smoke:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Exercise node-local auth fallback and revoke eviction
        run: bash ./scripts/smoke-ingest-auth-cache.sh

  session-ingest-events-smoke:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Exercise user Session assignment and ingest events
        run: bash ./scripts/smoke-session-ingest-events.sh
