logLevel: info

# Publisher authentication uses HTTP. The checked-in PoC default points at the
# local Control Plane, while production/PoC compose overrides authHTTPAddress
# to the Node Agent auth proxy. The proxy still asks the Control Plane during
# normal operation and only falls back to a short-lived positive cache when the
# upstream is unavailable.
authMethod: http
authHTTPAddress: http://control-ui:8080/internal/ingest/auth
authHTTPExclude:
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

rtsp: yes
rtspAddress: :8554
# リレー用途はNATやUDPポート枯渇に弱いUDP unicastより、単一TCP接続のinterleavedを優先する。
rtspTransports: [tcp]

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['http://localhost:8080', 'http://127.0.0.1:8080']

srt: yes
srtAddress: :8890

api: yes
apiAddress: :9997

metrics: yes
metricsAddress: :9998

paths:
  live/input:
    source: publisher
    # A second publisher must not silently evict a live one. Reconnect is
    # allowed after the prior publisher actually disconnects.
    overridePublisher: false
    maxReaders: 4
  output/relay:
    source: publisher
    overridePublisher: false
    maxReaders: 1
