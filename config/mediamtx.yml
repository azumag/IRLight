logLevel: info

rtsp: yes
rtspAddress: :8554
# リレー用途はNATやUDPポート枯渇に弱いUDP unicastより、単一TCP接続のinterleavedを優先する。
rtspTransports: [tcp]

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['http://localhost:8080', 'http://127.0.0.1:8080']

srt: yes
srtAddress: :8890

api: yes
apiAddress: :9997

metrics: yes
metricsAddress: :9998

# Phase 0では認証をまだ実装しない。外部公開禁止。
paths:
  live/input:
    source: publisher
    maxReaders: 4
  output/relay:
    source: publisher
    maxReaders: 4
