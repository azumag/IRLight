name: irlight-node

# Production compose for one on-demand Media Node.
#
# - Prebuilt images only: nothing here uses `build:` for the media stack.
# - MediaMTX API / metrics / RTSP stay on the internal network.
# - Public exposure lives in docker-compose.node.public.yml.
# - Continuity always publishes to the local MediaMTX relay. External
#   destination failures are isolated in the Egress Gateway.
# - Destination secrets are delivered as tmpfs files, never as env vars or
#   process arguments.

x-media-env: &media-env
  INPUT_URI: ${INPUT_URI:-rtsp://mediamtx:8554/live/input}
  INPUT_URI_FILE: /run/irlight/continuity-secrets/media_input_uri
  EGRESS_URL: rtmp://mediamtx:1935/output/relay
  EGRESS_URL_FILE: /run/irlight/continuity-secrets/media_publish_uri
  STATE_DIR: /state
  VIDEO_WIDTH: ${VIDEO_WIDTH:-1280}
  VIDEO_HEIGHT: ${VIDEO_HEIGHT:-720}
  VIDEO_FPS: ${VIDEO_FPS:-30}
  VIDEO_BITRATE_KBPS: ${VIDEO_BITRATE_KBPS:-3500}
  INPUT_TIMEOUT_SECONDS: ${INPUT_TIMEOUT_SECONDS:-1.5}
  RECOVERY_STABLE_SECONDS: ${RECOVERY_STABLE_SECONDS:-3.0}
  SOURCE_RETRY_SECONDS: ${SOURCE_RETRY_SECONDS:-3.0}
  PROFILE: ${PROFILE:-COMPOSITED_VIDEO_POC}

services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.0
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: ${NODE_INGEST_AUTH_URL:-http://node-agent:8090/auth}
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    networks: [media, node-auth, node-control]

  continuity:
    image: ${NODE_CONTINUITY_IMAGE:-ghcr.io/azumag/irlight-continuity:phase-b-spike}
    restart: unless-stopped
    depends_on:
      - mediamtx
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [media]
    environment: *media-env
    volumes:
      - irlight-state:/state
      - type: volume
        source: irlight-continuity-secrets
        target: /run/irlight/continuity-secrets
        volume:
          nocopy: true
        read_only: true

  egress-gateway:
    image: ${NODE_EGRESS_GATEWAY_IMAGE:-ghcr.io/azumag/irlight-egress-gateway:phase-b-spike}
    # Transient reconnect is handled inside the Gateway. A terminal
    # AUTH_FAILED/PUBLISH_CONFLICT must remain stopped instead of being turned
    # into an infinite Docker restart loop.
    restart: "no"
    depends_on:
      - mediamtx
      - continuity
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [media]
    environment:
      EGRESS_INPUT_URI: ${EGRESS_INPUT_URI:-rtsp://mediamtx:8554/output/relay}
      EGRESS_INPUT_URI_FILE: /run/irlight/relay-secrets/media_relay_uri
      EGRESS_URL_FILE: /run/irlight/egress-secrets/egress_url
      EGRESS_VERIFIED_PEER_IP_FILE: /run/irlight/egress-secrets/egress_verified_peer_ip
      # Production is fail-closed. Set to 1 only for explicitly trusted
      # self-hosted/private destinations and local test networks.
      EGRESS_ALLOW_PRIVATE_TARGETS: ${EGRESS_ALLOW_PRIVATE_TARGETS:-0}
      # rtmp2sink migration remains opt-in until real-platform verification.
      EGRESS_RTMP_SINK_FACTORY: ${EGRESS_RTMP_SINK_FACTORY:-rtmpsink}
      EGRESS_STATUS_FILE: /state/egress.json
      EGRESS_CONNECT_TIMEOUT_SECONDS: ${EGRESS_CONNECT_TIMEOUT_SECONDS:-15}
      EGRESS_RETRY_INITIAL_SECONDS: ${EGRESS_RETRY_INITIAL_SECONDS:-1}
      EGRESS_RETRY_MAX_SECONDS: ${EGRESS_RETRY_MAX_SECONDS:-30}
      EGRESS_RETRY_MULTIPLIER: ${EGRESS_RETRY_MULTIPLIER:-2}
      EGRESS_RETRY_JITTER_RATIO: ${EGRESS_RETRY_JITTER_RATIO:-0.2}
      EGRESS_MAX_ATTEMPTS: ${EGRESS_MAX_ATTEMPTS:-0}
      EGRESS_MAX_RETRY_SECONDS: ${EGRESS_MAX_RETRY_SECONDS:-0}
    volumes:
      - irlight-state:/state
      - type: volume
        source: irlight-relay-secrets
        target: /run/irlight/relay-secrets
        volume:
          nocopy: true
        read_only: true
      - type: volume
        source: irlight-egress-secrets
        target: /run/irlight/egress-secrets
        volume:
          nocopy: true
        read_only: true

  node-agent:
    image: ${NODE_AGENT_IMAGE:-ghcr.io/azumag/irlight-node-agent:phase-b-spike}
    # A clean STOP must not restart with the already-consumed bootstrap token.
    # Missing heartbeats are handled fail-closed by the Control Plane reaper.
    restart: "no"
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - mediamtx
      - continuity
      - egress-gateway
    environment:
      NODE_CONTROL_PLANE_URL: ${NODE_CONTROL_PLANE_URL:-http://control-plane:8080}
      NODE_BOOTSTRAP_TOKEN_FILE: ${NODE_BOOTSTRAP_TOKEN_FILE:-/run/secrets/bootstrap_token}
      NODE_PROVIDER_SERVER_ID: ${NODE_PROVIDER_SERVER_ID:-local-node}
      NODE_BOOT_ID: ${NODE_BOOT_ID:-compose-boot}
      NODE_AGENT_VERSION: ${NODE_AGENT_VERSION:-0.5.0-spike}
      NODE_MEDIA_SECRET_DIR: /run/irlight/continuity-secrets
      NODE_DOCKER_COMMAND_TIMEOUT_SECONDS: ${NODE_DOCKER_COMMAND_TIMEOUT_SECONDS:-15}
      NODE_RELAY_SECRET_DIR: /run/irlight/relay-secrets
      NODE_EGRESS_SECRET_DIR: /run/irlight/egress-secrets
      NODE_EGRESS_STATUS_FILE: /state/egress.json
      NODE_HEARTBEAT_INTERVAL: ${NODE_HEARTBEAT_INTERVAL:-10}
      NODE_BOOTSTRAP_TIMEOUT_SECONDS: ${NODE_BOOTSTRAP_TIMEOUT_SECONDS:-120}
      NODE_BOOTSTRAP_RETRY_SECONDS: ${NODE_BOOTSTRAP_RETRY_SECONDS:-2}
      NODE_SUPERVISOR: compose
      EGRESS_GATEWAY_ENABLED: ${EGRESS_GATEWAY_ENABLED:-1}
      NODE_COMPOSE_FILE: /opt/irlight/docker-compose.control.yml
      NODE_COMPOSE_PROJECT: irlight-node
      NODE_INGEST_AUTH_PROXY_ENABLED: ${NODE_INGEST_AUTH_PROXY_ENABLED:-1}
      NODE_INGEST_AUTH_LISTEN_HOST: 0.0.0.0
      NODE_INGEST_AUTH_LISTEN_PORT: ${NODE_INGEST_AUTH_LISTEN_PORT:-8090}
      NODE_INGEST_AUTH_UPSTREAM_URL: ${NODE_INGEST_AUTH_UPSTREAM_URL:-}
      NODE_INGEST_AUTH_UPSTREAM_TIMEOUT_SECONDS: ${NODE_INGEST_AUTH_UPSTREAM_TIMEOUT_SECONDS:-2}
      NODE_INGEST_AUTH_CACHE_MAX_AGE_SECONDS: ${NODE_INGEST_AUTH_CACHE_MAX_AGE_SECONDS:-300}
      NODE_INGEST_AUTH_CACHE_MAX_ENTRIES: ${NODE_INGEST_AUTH_CACHE_MAX_ENTRIES:-256}
      NODE_INGEST_POLICY_ENABLED: ${NODE_INGEST_POLICY_ENABLED:-1}
      NODE_MEDIAMTX_API_URL: ${NODE_MEDIAMTX_API_URL:-http://mediamtx:9997}
      NODE_INGEST_PATH: ${NODE_INGEST_PATH:-live/input}
      NODE_INGEST_MAX_BITRATE_BPS: ${NODE_INGEST_MAX_BITRATE_BPS:-6000000}
      NODE_INGEST_BITRATE_VIOLATION_SAMPLES: ${NODE_INGEST_BITRATE_VIOLATION_SAMPLES:-2}
      NODE_INGEST_QUALITY_ENABLED: ${NODE_INGEST_QUALITY_ENABLED:-1}
      NODE_INGEST_SAMPLE_URL: ${NODE_INGEST_SAMPLE_URL:-rtsp://mediamtx:8554/live/input}
      NODE_INGEST_SAMPLE_URL_FILE: /run/irlight/continuity-secrets/media_input_uri
      NODE_RELAY_CLIENT_OBSERVER_ENABLED: ${NODE_RELAY_CLIENT_OBSERVER_ENABLED:-1}
      NODE_RELAY_PATH: output/relay
      NODE_INGEST_SAMPLE_SECONDS: ${NODE_INGEST_SAMPLE_SECONDS:-4}
      NODE_INGEST_MIN_FPS: ${NODE_INGEST_MIN_FPS:-20}
      NODE_INGEST_PREFERRED_MIN_FPS: ${NODE_INGEST_PREFERRED_MIN_FPS:-24}
      NODE_INGEST_PREFERRED_MAX_FPS: ${NODE_INGEST_PREFERRED_MAX_FPS:-35}
      NODE_INGEST_MAX_FPS: ${NODE_INGEST_MAX_FPS:-40}
      NODE_INGEST_MAX_GOP_SECONDS: ${NODE_INGEST_MAX_GOP_SECONDS:-4}
      NODE_INGEST_MIN_PROGRESS_RATIO: ${NODE_INGEST_MIN_PROGRESS_RATIO:-0.60}
      NODE_INGEST_MIN_BITRATE_BPS: ${NODE_INGEST_MIN_BITRATE_BPS:-500000}
      NODE_INGEST_LOW_BITRATE_SAMPLES: ${NODE_INGEST_LOW_BITRATE_SAMPLES:-2}
    volumes:
      - irlight-state:/state
      - irlight-continuity-secrets:/run/irlight/continuity-secrets
      - irlight-relay-secrets:/run/irlight/relay-secrets
      - irlight-egress-secrets:/run/irlight/egress-secrets
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [node-auth, node-control]
    secrets:
      - bootstrap_token

volumes:
  irlight-state:
  irlight-continuity-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=700
  irlight-relay-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=700
  irlight-egress-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=700

networks:
  media:
    # Egress Gateway requires outbound internet access; only the auth plane
    # is isolated from external networks.
    internal: false
  node-auth:
    internal: true
  node-control:
    internal: true

secrets:
  bootstrap_token:
    file: ./secrets/bootstrap_token
