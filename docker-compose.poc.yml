name: irlight-poc

services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.0
    restart: unless-stopped
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:1935:1935"     # RTMP ingest / local relay output
      - "127.0.0.1:8554:8554"     # RTSP preview
      - "127.0.0.1:8888:8888"     # HLS preview
      - "127.0.0.1:8890:8890/udp" # SRT ingest (MediaMTX)

  continuity:
    build:
      context: ./apps/continuity
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      INPUT_URI: ${INPUT_URI:-rtsp://mediamtx:8554/live/input}
      EGRESS_URL: ${EGRESS_URL:-rtmp://mediamtx:1935/output/relay}
      STATE_DIR: /state
      VIDEO_WIDTH: ${VIDEO_WIDTH:-1280}
      VIDEO_HEIGHT: ${VIDEO_HEIGHT:-720}
      VIDEO_FPS: ${VIDEO_FPS:-30}
      VIDEO_BITRATE_KBPS: ${VIDEO_BITRATE_KBPS:-3500}
      INPUT_TIMEOUT_SECONDS: ${INPUT_TIMEOUT_SECONDS:-1.5}
      RECOVERY_STABLE_SECONDS: ${RECOVERY_STABLE_SECONDS:-3.0}
      SOURCE_RETRY_SECONDS: ${SOURCE_RETRY_SECONDS:-3.0}
      PROFILE: ${PROFILE:-COMPOSITED_VIDEO_POC}
    volumes:
      - irlight-state:/state

  control-ui:
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    restart: unless-stopped
    depends_on:
      - continuity
    environment:
      STATE_DIR: /state
      NODE_STATE_DIR: /state
      NODE_BOOTSTRAP_TOKENS: poc-node-token
      NODE_EGRESS_URL: rtmp://mediamtx:1935/output/relay
      COOKIE_INSECURE: "1"
      IRLIGHT_VERIFY_ALLOW_PRIVATE_TARGETS: "1"
      IRLIGHT_INGEST_AUTH_GUARD_ENABLED: ${IRLIGHT_INGEST_AUTH_GUARD_ENABLED:-1}
      IRLIGHT_INGEST_AUTH_FAILURE_WINDOW_SECONDS: ${IRLIGHT_INGEST_AUTH_FAILURE_WINDOW_SECONDS:-60}
      IRLIGHT_INGEST_AUTH_MAX_FAILURES_PER_CREDENTIAL: ${IRLIGHT_INGEST_AUTH_MAX_FAILURES_PER_CREDENTIAL:-8}
      IRLIGHT_INGEST_AUTH_MAX_FAILURES_PER_IP: ${IRLIGHT_INGEST_AUTH_MAX_FAILURES_PER_IP:-20}
      IRLIGHT_INGEST_AUTH_LOCKOUT_SECONDS: ${IRLIGHT_INGEST_AUTH_LOCKOUT_SECONDS:-120}
      IRLIGHT_INGEST_AUTH_EVENT_LIMIT: ${IRLIGHT_INGEST_AUTH_EVENT_LIMIT:-200}
      IRLIGHT_INGEST_AUTH_BUCKET_LIMIT: ${IRLIGHT_INGEST_AUTH_BUCKET_LIMIT:-4096}
    volumes:
      - irlight-state:/state
    ports:
      - "127.0.0.1:8080:8080"

  node-agent:
    build:
      context: ./apps/node-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mediamtx
      - control-ui
    environment:
      NODE_CONTROL_PLANE_URL: http://control-ui:8080
      NODE_BOOTSTRAP_TOKEN: poc-node-token
      NODE_PROVIDER_SERVER_ID: poc-node
      NODE_BOOT_ID: poc-boot
      NODE_AGENT_VERSION: 0.4.0-spike
      NODE_SECRET_DIR: /tmp/irlight-node-secrets
      NODE_HEARTBEAT_INTERVAL: "2"
      NODE_SUPERVISOR: fake
      NODE_MEDIAMTX_API_URL: http://mediamtx:9997
      NODE_INGEST_POLICY_ENABLED: "1"
      NODE_INGEST_MAX_BITRATE_BPS: "6000000"
      NODE_INGEST_BITRATE_VIOLATION_SAMPLES: "2"
      NODE_INGEST_QUALITY_ENABLED: "1"
      NODE_INGEST_SAMPLE_URL: rtsp://mediamtx:8554/live/input
      NODE_INGEST_SAMPLE_SECONDS: "3"
      NODE_INGEST_MIN_FPS: "20"
      NODE_INGEST_PREFERRED_MIN_FPS: "24"
      NODE_INGEST_PREFERRED_MAX_FPS: "35"
      NODE_INGEST_MAX_FPS: "40"
      NODE_INGEST_MAX_GOP_SECONDS: "4"
      NODE_INGEST_MIN_PROGRESS_RATIO: "0.55"
      NODE_INGEST_MIN_BITRATE_BPS: "500000"
      NODE_INGEST_LOW_BITRATE_SAMPLES: "2"

volumes:
  irlight-state:
