name: irlight-poc

services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.0
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://node-agent:8090/auth
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:1935:1935"     # RTMP ingest / local relay output
      - "127.0.0.1:8554:8554"     # RTSP preview
      - "127.0.0.1:8888:8888"     # HLS preview
      - "127.0.0.1:8890:8890/udp" # SRT ingest (MediaMTX)

  continuity:
    build:
      context: ./apps/continuity
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      INPUT_URI: ${INPUT_URI:-rtsp://mediamtx:8554/live/input}
      INPUT_URI_FILE: /run/irlight/continuity-secrets/media_input_uri
      EGRESS_URL: ${EGRESS_URL:-rtmp://mediamtx:1935/output/relay}
      EGRESS_URL_FILE: /run/irlight/continuity-secrets/media_publish_uri
      STATE_DIR: /state
      VIDEO_WIDTH: ${VIDEO_WIDTH:-1280}
      VIDEO_HEIGHT: ${VIDEO_HEIGHT:-720}
      VIDEO_FPS: ${VIDEO_FPS:-30}
      VIDEO_BITRATE_KBPS: ${VIDEO_BITRATE_KBPS:-3500}
      INPUT_TIMEOUT_SECONDS: ${INPUT_TIMEOUT_SECONDS:-1.5}
      RECOVERY_STABLE_SECONDS: ${RECOVERY_STABLE_SECONDS:-3.0}
      SOURCE_RETRY_SECONDS: ${SOURCE_RETRY_SECONDS:-3.0}
      PROFILE: ${PROFILE:-COMPOSITED_VIDEO_POC}
    volumes:
      - irlight-state:/state
      - irlight-continuity-secrets:/run/irlight/continuity-secrets:ro

  control-ui:
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    restart: unless-stopped
    depends_on:
      - continuity
    environment:
      STATE_DIR: /state
      NODE_STATE_DIR: /state
      RECOVERY_STABLE_SECONDS: ${RECOVERY_STABLE_SECONDS:-3.0}
      NODE_MEDIA_HEALTH_FAILURE_GRACE_SECONDS: ${NODE_MEDIA_HEALTH_FAILURE_GRACE_SECONDS:-30}
      NODE_BOOTSTRAP_TOKENS: poc-node-token
      NODE_INTERNAL_ADMIN_TOKENS: poc-admin-token
      NODE_EGRESS_URL: rtmp://mediamtx:1935/output/relay
      NODE_EGRESS_VERIFIED_PEER_IP: 198.51.100.10
      COOKIE_INSECURE: "1"
      IRLIGHT_VERIFY_ALLOW_PRIVATE_TARGETS: "1"
      # Development-only fallback key. Production must mount its own key file.
      IRLIGHT_SECRET_MASTER_KEY: ${IRLIGHT_SECRET_MASTER_KEY:-SkPUvZGrLTg_3NC83_vSAccU3b4bLOZPzDkNoUIC3pw=}
      IRLIGHT_INGEST_AUTH_CACHE_MAX_AGE_SECONDS: ${IRLIGHT_INGEST_AUTH_CACHE_MAX_AGE_SECONDS:-300}
      IRLIGHT_INGEST_AUTH_GUARD_ENABLED: ${IRLIGHT_INGEST_AUTH_GUARD_ENABLED:-1}
      IRLIGHT_INGEST_AUTH_FAILURE_WINDOW_SECONDS: ${IRLIGHT_INGEST_AUTH_FAILURE_WINDOW_SECONDS:-60}
      IRLIGHT_INGEST_AUTH_MAX_FAILURES_PER_CREDENTIAL: ${IRLIGHT_INGEST_AUTH_MAX_FAILURES_PER_CREDENTIAL:-8}
      IRLIGHT_INGEST_AUTH_MAX_FAILURES_PER_IP: ${IRLIGHT_INGEST_AUTH_MAX_FAILURES_PER_IP:-20}
      IRLIGHT_INGEST_AUTH_LOCKOUT_SECONDS: ${IRLIGHT_INGEST_AUTH_LOCKOUT_SECONDS:-120}
      IRLIGHT_INGEST_AUTH_BLOCKED_EVENT_INTERVAL_SECONDS: ${IRLIGHT_INGEST_AUTH_BLOCKED_EVENT_INTERVAL_SECONDS:-5}
      IRLIGHT_INGEST_AUTH_EVENT_LIMIT: ${IRLIGHT_INGEST_AUTH_EVENT_LIMIT:-200}
      IRLIGHT_INGEST_AUTH_BUCKET_LIMIT: ${IRLIGHT_INGEST_AUTH_BUCKET_LIMIT:-4096}
    volumes:
      - irlight-state:/state
    ports:
      - "127.0.0.1:8080:8080"

  node-agent:
    build:
      context: ./apps/node-agent
      dockerfile: Dockerfile
    restart: "no"
    stop_grace_period: 30s
    depends_on:
      - mediamtx
      - control-ui
    environment:
      NODE_CONTROL_PLANE_URL: http://control-ui:8080
      NODE_BOOTSTRAP_TOKEN: poc-node-token
      NODE_PROVIDER_SERVER_ID: poc-node
      NODE_BOOT_ID: poc-boot
      NODE_AGENT_VERSION: 0.4.0-spike
      NODE_MEDIA_SECRET_DIR: /run/irlight/continuity-secrets
      NODE_RELAY_SECRET_DIR: /run/irlight/relay-secrets
      NODE_EGRESS_SECRET_DIR: /run/irlight/egress-secrets
      NODE_CONTROL_STATE_FILE: /state/control.json
      NODE_HEARTBEAT_INTERVAL: "2"
      NODE_BOOTSTRAP_TIMEOUT_SECONDS: "120"
      NODE_BOOTSTRAP_RETRY_SECONDS: "1"
      NODE_SUPERVISOR: fake
      NODE_INGEST_AUTH_PROXY_ENABLED: "1"
      NODE_INGEST_AUTH_LISTEN_HOST: 0.0.0.0
      NODE_INGEST_AUTH_LISTEN_PORT: "8090"
      NODE_INGEST_AUTH_UPSTREAM_URL: http://control-ui:8080/internal/ingest/auth
      NODE_INGEST_AUTH_UPSTREAM_TIMEOUT_SECONDS: "1"
      NODE_INGEST_AUTH_CACHE_MAX_AGE_SECONDS: "300"
      NODE_INGEST_AUTH_CACHE_MAX_ENTRIES: "256"
      NODE_MEDIAMTX_API_URL: http://mediamtx:9997
      NODE_INGEST_POLICY_ENABLED: "1"
      NODE_INGEST_MAX_BITRATE_BPS: "6000000"
      NODE_INGEST_BITRATE_VIOLATION_SAMPLES: "2"
      NODE_INGEST_QUALITY_ENABLED: "1"
      NODE_INGEST_SAMPLE_URL: rtsp://mediamtx:8554/live/input
      NODE_INGEST_SAMPLE_URL_FILE: /run/irlight/continuity-secrets/media_input_uri
      NODE_INGEST_SAMPLE_SECONDS: "3"
      NODE_INGEST_MIN_FPS: "20"
      NODE_INGEST_PREFERRED_MIN_FPS: "24"
      NODE_INGEST_PREFERRED_MAX_FPS: "35"
      NODE_INGEST_MAX_FPS: "40"
      NODE_INGEST_MAX_GOP_SECONDS: "4"
      NODE_INGEST_MIN_PROGRESS_RATIO: "0.55"
      NODE_INGEST_MIN_BITRATE_BPS: "500000"
      NODE_INGEST_LOW_BITRATE_SAMPLES: "2"
    volumes:
      - irlight-state:/state
      - irlight-continuity-secrets:/run/irlight/continuity-secrets
      - irlight-relay-secrets:/run/irlight/relay-secrets
      - irlight-egress-secrets:/run/irlight/egress-secrets

volumes:
  irlight-state:
  irlight-continuity-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=700
  irlight-relay-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=700
  irlight-egress-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=700
