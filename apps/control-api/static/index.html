<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>IRLight 配信コントロール</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,"Noto Sans JP",sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1020; color: #f9fafb; }
    main { width: min(100%, 42rem); margin: 0 auto; padding: 1rem 1rem 6rem; }
    h1 { font-size: 1.35rem; margin: .25rem 0 1rem; }
    .card { background: #151d31; border: 1px solid #2a3654; border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: 1fr auto; gap: .7rem 1rem; align-items: center; }
    .label { color: #aebbd5; }
    .value { font-weight: 750; text-align: right; }
    .badge { display: inline-flex; align-items: center; gap: .45rem; border-radius: 999px; padding: .35rem .7rem; background: #283652; }
    .dot { width: .7rem; height: .7rem; border-radius: 50%; background: #94a3b8; }
    .dot.live { background: #34d399; }
    .dot.warn { background: #fbbf24; }
    .dot.muted { background: #fb7185; }
    button { width: 100%; min-height: 5.2rem; border: 0; border-radius: 1rem; font-size: 1.25rem; font-weight: 850; padding: 1rem; cursor: pointer; touch-action: manipulation; }
    button.live { background: #e11d48; color: white; }
    button.muted { background: #10b981; color: #06120e; }
    button.unknown { background: #475569; color: #f8fafc; }
    button:disabled { opacity: .55; cursor: wait; }
    .small { color: #aebbd5; font-size: .88rem; line-height: 1.55; }
    .error { color: #fda4af; min-height: 1.5em; }
  </style>
</head>
<body>
<main>
  <h1>IRLight 配信コントロール</h1>
  <section class="card grid" aria-live="polite">
    <span class="label">セッション</span><span id="session" class="value badge"><span id="sessionDot" class="dot"></span><span>読込中</span></span>
    <span class="label">表示中</span><span id="video" class="value">—</span>
    <span class="label">配信音声</span><span id="audio" class="value badge"><span id="audioDot" class="dot"></span><span>—</span></span>
    <span class="label">入力映像</span><span id="inputVideo" class="value">—</span>
    <span class="label">入力音声</span><span id="inputAudio" class="value">—</span>
    <span class="label">指定状態</span><span id="desired" class="value">—</span>
    <span class="label">実状態</span><span id="actual" class="value">—</span>
    <span class="label">バージョン</span><span id="version" class="value">—</span>
    <span class="label">最終反映</span><span id="updated" class="value">—</span>
  </section>

  <section class="card">
    <button id="audioButton" disabled>状態を取得しています</button>
    <p class="small">ミュートしても映像と配信接続は維持し、連続した無音AACを送ります。表示は指定状態ではなく実際の音声状態を優先し、最新指示をランタイムが確認するまでは次の操作を受け付けません。</p>
    <p id="error" class="error" role="alert"></p>
  </section>

  <section class="card small">
    <strong>Phase 0 ローカルPoC</strong><br>
    認証・TLS・複数ユーザー制御は未実装です。インターネットへ公開しないでください。現在地・時刻・通信指標の映像オーバーレイは次フェーズです。
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const RUNTIME_STALE_SECONDS = 3;
let snapshot = null;
let applying = false;
let statusAvailable = false;
let controlUnavailable = false;
let refreshPromise = null;
let snapshotReceivedAtMs = null;
let snapshotRequestAgeSeconds = Number.POSITIVE_INFINITY;

function textForSession(value) {
  return ({LIVE:'通常映像', HOLDING:'待機中', STABILIZING:'復帰確認中', STARTING:'起動中'})[value] || value || '不明';
}

function audioState(control, runtime, serverTime, snapshotAgeSeconds = 0) {
  const desired = control.audio_mode === 'MUTED' ? 'MUTED' : 'LIVE';
  const actual = runtime.actual_audio_mode || 'UNKNOWN';
  const actualKnown = actual === 'LIVE' || actual === 'MUTED' || actual === 'SILENT_FALLBACK';
  const controlVersion = Number.isInteger(control.version) ? control.version : null;
  const runtimeVersion = Number.isInteger(runtime.control_version) ? runtime.control_version : null;
  const controlCommand = control.command_id ?? null;
  const runtimeCommand = runtime.command_id ?? null;
  const commandIdentityValid = controlVersion === 0
    ? controlCommand === null && runtimeCommand === null
    : controlVersion !== null && controlVersion > 0 && typeof controlCommand === 'string' && controlCommand.length > 0 && controlCommand === runtimeCommand;
  const commandAcked = controlVersion === runtimeVersion && commandIdentityValid;
  const runtimeAge = Number(serverTime) + Number(snapshotAgeSeconds) - Number(runtime.updated_at);
  const runtimeStale = !Number.isFinite(runtimeAge) || !Number.isFinite(snapshotAgeSeconds) || snapshotAgeSeconds < -1 || runtimeAge < -1 || runtimeAge > RUNTIME_STALE_SECONDS;

  if (runtimeStale || !actualKnown) {
    return {desired, actual, actualKnown, commandAcked, runtimeStale, label:'状態確認不能', dot:'warn', actualLabel:'状態確認不能'};
  }

  const labels = {
    LIVE: '音声オン',
    MUTED: 'ミュート中',
    SILENT_FALLBACK: '入力音声なし',
  };
  const actualLabel = labels[actual];

  if (!commandAcked) {
    if (desired === 'MUTED' && actual === 'LIVE') {
      return {desired, actual, actualKnown, commandAcked, runtimeStale, label:'音声オン（ミュート未反映）', dot:'warn', actualLabel:`${actualLabel}（最新指示未確認）`};
    }
    if (desired === 'LIVE' && actual === 'MUTED') {
      return {desired, actual, actualKnown, commandAcked, runtimeStale, label:'ミュート中（解除未反映）', dot:'warn', actualLabel:`${actualLabel}（最新指示未確認）`};
    }
    if (desired === 'MUTED') {
      const label = actual === 'SILENT_FALLBACK'
        ? '入力音声なし（ミュート指示未確認）'
        : 'ミュート適用待ち（ACK未確認）';
      return {desired, actual, actualKnown, commandAcked, runtimeStale, label, dot:'warn', actualLabel:`${actualLabel}（最新指示未確認）`};
    }
    return {desired, actual, actualKnown, commandAcked, runtimeStale, label:`${actualLabel}（最新指示未確認）`, dot:'warn', actualLabel:`${actualLabel}（最新指示未確認）`};
  }

  const dot = actual === 'LIVE' ? 'live' : (actual === 'MUTED' ? 'muted' : 'warn');
  return {desired, actual, actualKnown, commandAcked, runtimeStale, label:actualLabel, dot, actualLabel};
}

function renderUnavailable() {
  const unknown = '状態確認不能';
  $('session').lastElementChild.textContent = unknown;
  $('sessionDot').className = 'dot warn';
  for (const id of ['video', 'inputVideo', 'inputAudio', 'desired', 'actual', 'version', 'updated']) {
    $(id).textContent = unknown;
  }
  $('audio').lastElementChild.textContent = unknown;
  $('audioDot').className = 'dot warn';
  const button = $('audioButton');
  button.disabled = true;
  button.className = 'unknown';
  button.textContent = controlUnavailable ? '音声制御APIは利用できません' : '状態を再取得しています';
}

function render(data) {
  snapshot = data;
  if (!statusAvailable) {
    renderUnavailable();
    return;
  }
  const c = data.control || {};
  const r = data.runtime || {};
  const snapshotAgeSeconds = snapshotReceivedAtMs === null
    ? Number.POSITIVE_INFINITY
    : snapshotRequestAgeSeconds + (Date.now() - snapshotReceivedAtMs) / 1000;
  const state = audioState(c, r, data.server_time, snapshotAgeSeconds);
  const runtimeTrusted = !state.runtimeStale;
  $('session').lastElementChild.textContent = runtimeTrusted ? textForSession(r.session_status) : '状態確認不能';
  $('sessionDot').className = 'dot ' + (runtimeTrusted && r.session_status === 'LIVE' ? 'live' : 'warn');
  $('video').textContent = runtimeTrusted ? (r.video_source === 'LIVE' ? '通常映像' : '待機画面') : '状態確認不能';
  $('audio').lastElementChild.textContent = state.label;
  $('audioDot').className = 'dot ' + state.dot;
  $('inputVideo').textContent = runtimeTrusted ? (r.input_video_recent ? '受信中' : '停止') : '状態確認不能';
  $('inputAudio').textContent = runtimeTrusted ? (r.input_audio_recent ? '受信中' : '停止／なし') : '状態確認不能';
  $('updated').textContent = runtimeTrusted && r.updated_at ? new Date(r.updated_at * 1000).toLocaleTimeString() : '状態確認不能';
  $('desired').textContent = state.desired === 'MUTED' ? 'ミュート指定' : 'オン指定';
  $('actual').textContent = state.actualLabel;
  const controlVersion = Number.isInteger(c.version) ? c.version : '—';
  const runtimeVersion = runtimeTrusted && Number.isInteger(r.control_version) ? r.control_version : '状態確認不能';
  $('version').textContent = `指定 ${controlVersion} / 反映 ${runtimeVersion}`;
  const button = $('audioButton');
  button.disabled = applying || controlUnavailable || !statusAvailable || state.runtimeStale || !state.actualKnown || !state.commandAcked;
  button.className = state.runtimeStale || !state.actualKnown ? 'unknown' : (state.desired === 'MUTED' ? 'muted' : 'live');
  button.textContent = applying
    ? '指示を送信中…'
    : (controlUnavailable
      ? '音声制御APIは利用できません'
      : (!statusAvailable
        ? '状態を再取得しています'
        : (state.runtimeStale || !state.actualKnown
        ? '実状態を確認できません'
        : (!state.commandAcked
          ? '最新の指示を反映中…'
          : (state.desired === 'MUTED' ? '配信音声をオンに戻す' : '配信音声をミュートする')))));
}

function markStatusUnavailable(message) {
  statusAvailable = false;
  renderUnavailable();
  $('error').textContent = message;
}

function refresh() {
  if (refreshPromise) return refreshPromise;
  refreshPromise = (async () => {
    const requestStartedAtMs = Date.now();
    try {
      const response = await fetch('/api/status', {cache:'no-store'});
      if (!response.ok) throw new Error(`status ${response.status}`);
      const data = await response.json();
      const receivedAtMs = Date.now();
      const requestAgeSeconds = (receivedAtMs - requestStartedAtMs) / 1000;
      snapshotReceivedAtMs = receivedAtMs;
      snapshotRequestAgeSeconds = requestAgeSeconds >= 0 ? requestAgeSeconds : Number.POSITIVE_INFINITY;
      statusAvailable = true;
      render(data);
      $('error').textContent = '';
    } catch (error) {
      markStatusUnavailable(`状態取得に失敗: ${error.message}`);
    }
  })();
  return refreshPromise.finally(() => {
    refreshPromise = null;
  });
}

async function refreshAfterCurrent() {
  if (refreshPromise) await refreshPromise;
  await refresh();
}

$('audioButton').addEventListener('click', async () => {
  if (!snapshot || applying || $('audioButton').disabled) return;
  applying = true;
  render(snapshot);
  const control = snapshot.control || {};
  const target = control.audio_mode === 'MUTED' ? 'LIVE' : 'MUTED';
  const idempotencyKey = crypto.randomUUID();
  try {
    const response = await fetch('/api/audio', {
      method: 'PUT',
      headers: {'Content-Type':'application/json', 'Idempotency-Key': idempotencyKey},
      body: JSON.stringify({mode: target, expected_version: control.version || 0})
    });
    if (response.status === 404) {
      controlUnavailable = true;
      await refreshAfterCurrent();
      $('error').textContent = '音声制御APIはこの環境では無効です。Session認証付きAPIへの移行が必要です';
      return;
    }
    if (response.status === 409) {
      await refreshAfterCurrent();
      $('error').textContent = '別画面で状態が更新されました。最新状態を再取得しました';
      return;
    }
    if (!response.ok) throw new Error(`control ${response.status}`);
    await refreshAfterCurrent();
  } catch (error) {
    // A lost PUT response is an unknown outcome: do not retry with a new key or
    // let another click toggle from the old snapshot. Re-read authoritative
    // desired/version first and keep the action closed if that also fails.
    statusAvailable = false;
    if (snapshot) render(snapshot);
    await refreshAfterCurrent();
    const recovery = statusAvailable
      ? '現在状態を再同期しました'
      : '操作結果を確認できないため操作を停止しています';
    $('error').textContent = `音声切替に失敗: ${error.message}。${recovery}`;
  } finally {
    applying = false;
    if (snapshot) render(snapshot);
  }
});

refresh();
setInterval(() => {
  if (snapshot && statusAvailable) render(snapshot);
  refresh();
}, 1000);
</script>
</body>
</html>
